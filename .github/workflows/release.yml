name: Release

# Push a tag that matches package.json (for example v0.2.0). CI tests, builds the native binaries for
# all four targets, packs ONE tarball, signs that exact file, and attaches it to a GitHub Release.
# Nothing is published to a package registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless cosign signing (short-lived OIDC identity, no stored signing key)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tag must match package.json
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

      # build:native cross-compiles all four targets; check then runs the Bun and Go tests against
      # the binary for this runner (linux/amd64).
      - run: bun run build:native
      - run: bun run check

      - name: Pack
        run: |
          # --ignore-scripts: the binaries above are what gets packed, not a second rebuild.
          npm pack --ignore-scripts
          tarball="rn-mobile-release-script-${VERSION}.tgz"
          test -f "${tarball}"
          # The tarball must contain all four binaries, or consumers on that platform get a broken CLI.
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            tar -tzf "${tarball}" | grep -q "package/bin/native/rnmrs-core-${target}$" \
              || { echo "missing rnmrs-core-${target} in ${tarball}" >&2; exit 1; }
          done
          sha256sum "${tarball}" > "${tarball}.sha256"
          echo "TARBALL=${tarball}" >> "$GITHUB_ENV"

      - name: Sign
        run: cosign sign-blob --yes --bundle "${TARBALL}.sigstore.json" "${TARBALL}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${TARBALL}" "${TARBALL}.sha256" "${TARBALL}.sigstore.json" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
