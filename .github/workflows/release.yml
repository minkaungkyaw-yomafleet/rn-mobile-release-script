name: Release

# Push a tag that matches package.json (for example v0.2.0). CI tests, builds the native binaries for
# all four targets, packs a tarball, signs it with cosign, attaches it to a GitHub Release, and
# publishes the package to the public npm registry as `rnmrs`.
#
# Publishing uses npm trusted publishing: npm trusts this exact repository and workflow file
# (configured on npmjs.com under the package's Settings, Trusted Publisher), so there is no stored
# token and no 2FA prompt, and npm records provenance automatically. Requirements: npm 11.5.1 or
# newer, Node 22.14 or newer, a GitHub-hosted runner, `id-token: write`, and a package.json
# `repository.url` that matches this repository exactly.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless cosign signing and npm trusted publishing (short-lived OIDC identity, no stored keys)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # ships an npm new enough for trusted publishing; checked below
          registry-url: https://registry.npmjs.org
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Tag must match package.json
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # Fail now, not after a long build: an older npm cannot do trusted publishing and the publish
      # step at the very end would fail.
      - name: npm must be 11.5.1 or newer
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm ${npm_version} is too old for trusted publishing (needs 11.5.1 or newer)" >&2
            exit 1
          fi
          echo "npm ${npm_version}"

      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

      # build:native cross-compiles all four targets; check then runs the Bun and Go tests against
      # the binary for this runner (linux/amd64).
      - run: bun run build:native
      - run: bun run check

      - name: Pack
        run: |
          # --ignore-scripts: the binaries above are what gets packed, not a second rebuild.
          npm pack --ignore-scripts
          tarball="rnmrs-${VERSION}.tgz"
          test -f "${tarball}"
          # The tarball must contain all four binaries, or consumers on that platform get a broken CLI.
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            tar -tzf "${tarball}" | grep -q "package/bin/native/rnmrs-core-${target}$" \
              || { echo "missing rnmrs-core-${target} in ${tarball}" >&2; exit 1; }
          done
          sha256sum "${tarball}" > "${tarball}.sha256"
          echo "TARBALL=${tarball}" >> "$GITHUB_ENV"

      - name: Sign
        run: cosign sign-blob --yes --bundle "${TARBALL}.sigstore.json" "${TARBALL}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip if it exists, so re-running a run that failed at the publish step works.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it as it is."
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${TARBALL}" "${TARBALL}.sha256" "${TARBALL}.sigstore.json" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

      # Last, because publishing to npm cannot be undone (a version number is never reused).
      - name: Publish to npm
        # No token: npm exchanges this job's GitHub identity for a short-lived publish credential.
        # --ignore-scripts: the binaries built above are what gets published, not a second rebuild.
        run: npm publish --access public --ignore-scripts
